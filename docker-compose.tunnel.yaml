name: dockge
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: louislam/dockge:latest
    container_name: dockge-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: dockge-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DOCKGE_HOST: ${BASE_HOST_NAME:-$HOSTNAME}
      PORT: 5001
    healthcheck:
      test: ['CMD-SHELL', 'extra/healthcheck']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/dockge:/app/data:z'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://dockge-app:5001'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - dockge
      - cloudflare


networks:
  dockge:
    name: dockge
    external: false
  cloudflare:
    external: true
