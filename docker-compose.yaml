# nginx proxy address - http://172.17.0.1:64155

name: dockge
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: louislam/dockge:latest
    container_name: dockge-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: dockge-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DOCKGE_HOST: ${BASE_HOST_NAME:-$HOSTNAME}
      PORT: 5001
    ports:
      - '172.17.0.1:64155:5001'
    volumes:
      - './volumes/data/dockge:/app/data:z'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    networks:
      - dockge

networks:
  dockge:
    name: dockge
    external: false
